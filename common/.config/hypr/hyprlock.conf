City = Nashville
Country = United States

#Background
background {
    monitor =
    #path = home/chris/Downloads/walls/wall3.jpg
    path = screenshot
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696

}

#Login Input Field
input-field {
    monitor = 
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(180, 190, 254, 0.6)
    inner_color = rgba(30, 30, 46, 0.6)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    font_family = Iosevka Nerd Font
    hide_input = false
    position = 0, -490
    halign = center
    valign = center
}

#Time Widget
label{
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color =rgb(203, 166, 247)
    font_size = 130
    font_family = Iosevka Nerd Font
    position = 0, 410
    halign = center
    valign = center
}

#Day-Month-Year
label{
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color =rgb(137, 180, 250)
    font_size = 42
    font_family = Iosevka Nerd Font
    position = 0, 540
    halign = center
    valign = center
}

#Modern Weather Widget
label {
    # Fetches weather automatically via IP location. Updates every 15 mins (900000ms).
    # Format '%c %t' prints a weather icon and the temperature.
    text = cmd[update:900000] curl -s -m 2 'https://wttr.in/?format=%c+%t'
    color = rgb(249, 226, 175)
    font_size = 55
    font_family = Iosevka Nerd Font
    position = 120, 0
    halign = left
    valign = center
}


#Profile Picture
image {
    monitor = 
    path = /home/chris/Downloads/PFPs/PFP1.jpg
